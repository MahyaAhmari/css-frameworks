<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="h-screen">
    <section class="h-full grid grid-cols-1 md:grid-cols-3 gap-x-4 gap-y-4">
        <div class="w-full bg-yellow-200 text-center p-8   md:col-span-2">A</div>
        <div class="w-full bg-red-200 text-center p-8    md:row-span-2">B</div>
        <div class="w-full bg-green-200 text-center p-8    md:col-start-2 md:row-start-4">C</div>
        <div class="w-full bg-blue-200 text-center p-8">D</div>
        <div class="w-full bg-teal-200 text-center p-8">E</div>
        <div class="w-full bg-purple-200 text-center p-8">F</div>
        <div class="w-full bg-violet-200 text-center p-8">G</div>
        <div class="w-full bg-amber-200 text-center p-8">H</div>
    </section>
</body>
</html>
