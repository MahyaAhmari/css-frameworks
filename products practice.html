<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/products practice.css">
</head>
<body dir="rtl">
    <!-- دسته بندی کالا ها -->
    <section class="container p-4">
        <h2 class="text-primary fw-bolder text-center">دسته بندی کالا‌ها</h2>
        <div class="d-flex justify-content-center gap-3 mt-3">
            <button class="btn btn-outline-primary rounded-pill px-3 py-2 border-2"><i class="bi bi-laptop"></i> لپ‌تاپ</button>
            <button class="btn btn-outline-success rounded-pill px-3 py-2 border-2"><i class="bi bi-phone"></i> تلفن همراه</button>
            <button class="btn btn-outline-danger rounded-pill px-3 py-2 border-2"><i class="bi bi-headphones"></i> هدفون</button>
            <button class="btn btn-outline-warning rounded-pill px-3 py-2 border-2"><i class="bi bi-camera"></i> دوربین</button>
        </div>
    </section>

    <!-- کارت های کالا -->
    <section class="container my-5">
        <h3 class="fw-bolder text-center mb-4 fw-bold">محصولات پیشنهادی</h3>
        <!-- کارت اول -->
        <div>
            <div class="card shadow border-0" style="width: 18rem;">
                <div>
                    <img src="assets/images/asus3.png" class="card-img-top img-fluid" alt="مانیتور">
                    <div class="position-absolute top-0 end-0 m-3">
                        <span class="badge bg-success fs-6 fw-light">جدید</span>
                    </div>
                </div>
                <div class="card-body">
                    <h5 class="card-title fw-bold">لپ‌تاپ گیمینگ asus</h5>
                    <p class="card-text text-muted">لپ‌تاب قدرتمند با پردازندۀ i7 و کارت گرافیک RTX</p>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-primary fw-bold">۲۵,۰۰۰,۰۰۰ تومان</span>
                        <span class="text-warning d-flex gap-1">
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star"></i>
                            <small class="text-dark">(۴.۲)</small>
                        </span>
                    </div>
                    <a href="#" class="btn btn-primary w-100"><i class="bi bi-cart-plus-fill"></i> افزودن به سبد خرید</a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
