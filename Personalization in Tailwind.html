<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalization in Tailwind</title>
    <link rel="stylesheet" href="src/output.css">
    <link rel="stylesheet" href="assets/css/Personalization in Tailwind.css">
</head>
<body class="h-screen">
    <section class="h-full grid grid-cols-3 gap-2">
        <div class="w-full bg-yellow-200 text-center p-8">A</div>
        <div class="w-full bg-red-200 text-center text-(length:--font-size)">B</div>
        <div class="w-full bg-green-200 text-center p-8">C</div>
        <div class="w-full bg-regal-blue text-center p-8">D</div>
        <div class="w-full bg-teal-200 text-center p-8">E</div>
        <div class="w-full bg-(--color-primary) text-center p-8">F</div>
    </section>
</body>
</html>
