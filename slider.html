<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>slider</title>
    <link rel="stylesheet" href="assets/css/css/bootstrap.min.css">
</head>
<body class="vh-100">
    <section class="w-50 m-auto mt-4 h-75 rounded-5 overflow-hidden">
        <div id="carouselExampleIndicators" class="carousel slide h-100" data-bs-ride="carousel" data-bs-interval="3000">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
    
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
    
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
    
            <div class="carousel-inner h-100">
                <div class="carousel-item active h-100">
                    <img src="assets/images/Most Wanted Nature Widescreen Wallpapers 628-60.jpg" class="d-block w-100 h-100 object-fit-cover" alt="image">
                </div>
    
                <div class="carousel-item h-100">
                    <img src="assets/images/Most Wanted Nature Widescreen Wallpapers 628-15.jpg" class="d-block w-100 h-100 object-fit-cover" alt="image">
                </div>
    
                <div class="carousel-item h-100">
                    <img src="assets/images/Most Wanted Nature Widescreen Wallpapers 628-59.jpg" class="d-block w-100 h-100 object-fit-cover" alt="image">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
    
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </section>

    <script src="assets/js/js/bootstrap.min.js"></script>
</body>
</html>
