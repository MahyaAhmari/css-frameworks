<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <link rel="stylesheet" href="src/output.css">
    <link rel="stylesheet" href="assets/css/animation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <style>
        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-60px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body dir="rtl" class="flex h-screen items-center justify-center font-vazir animate-gradient">
    <section class="w-1/3 h-8/12 bg-white rounded-lg shadow-2xl flex flex-col justify-center items-center p-8 animate-[slideDown_0.8s_ease-out_forwards]">
        <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="avatar" class="w-16 h-16 animate-bounce mt-3">
        <h2 class="text-2xl">ثبت نام کنید</h2>
        <p class="text-gray-500 text-sm">لطفا اطلاعات خود را وارد نمایید</p>

        <form class="space-y-4 w-full">
            <div class="flex gap-3 border-b border-gray-300 py-2 focus-within:border-blue-400 transition-colors mt-3">
                <i class="fa-solid fa-user opacity-60 text-xl"></i>
                <input type="text" placeholder="نام کاربری" class="focus:outline-0 flex-1 w-full">
            </div>
            
            <div class="flex gap-3 border-b border-gray-300 py-2 focus-within:border-blue-400 transition-colors mt-3">
                <i class="fa-solid fa-location-dot opacity-60 text-xl"></i>
                <input type="email" placeholder="ایمیل" class="focus:outline-0 flex-1 w-full">
            </div>
            
            <div class="flex gap-3 border-b border-gray-300 py-2 focus-within:border-blue-400 transition-colors mt-3">
                <i class="fa-solid fa-lock opacity-60 text-xl"></i>
                <input type="text" placeholder="رمز عبور" class="focus:outline-0 flex-1 w-full">
            </div>
            
            <button class="btn-primary w-full rounded-xl hover:scale-110 duration-500">ثبت نام</button>
        </form>
    </section>
</body>
</html>
